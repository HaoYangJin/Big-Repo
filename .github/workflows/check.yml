name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: Verify actual distribution
        run: python scripts/verify_plugin.py --output "${{ runner.temp }}/distribution check"
  plugin-load:
    name: plugin-load (${{ matrix.host }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: codex
            package: '@openai/codex@0.163.0'
            command: codex
          - host: claude-code
            package: '@anthropic-ai/claude-code@2.1.302'
            command: claude
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned official CLI in runner temporary directory
        run: npm install --prefix "$RUNNER_TEMP/host-cli" --registry https://registry.npmjs.org --no-audit --no-fund "${{ matrix.package }}"
      - name: Load release ZIP and exercise installed tools without a model
        run: python scripts/check_host.py --host "${{ matrix.host }}" --cli "$RUNNER_TEMP/host-cli/node_modules/.bin/${{ matrix.command }}" --output "$RUNNER_TEMP/host-verification-${{ matrix.host }}"
      - name: Save version-bound evidence and tested ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-verification-${{ matrix.host }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/host-verification-${{ matrix.host }}/host-verification.json
            ${{ runner.temp }}/host-verification-${{ matrix.host }}/distribution/distribution.json
            ${{ runner.temp }}/host-verification-${{ matrix.host }}/distribution/build-one/*.zip
            ${{ runner.temp }}/host-verification-${{ matrix.host }}/distribution/build-one/*.sha256
